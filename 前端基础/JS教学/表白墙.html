<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>表白墙</h1>
        <p>输入后点击提交，会将信息显示在表格中</p>
        
        <div class="row">
            <span>谁：</span>
            <input type="text" class="edit">
        </div>
        <div class="row">
            <span>对谁：</span>
            <input type="text" class="edit">
        </div>
        <div class="row">
            <span>说什么：</span>
            <input type="text" class="edit">
        </div>
        <div class="row">
        <input type="button" value="提交" class="submit">
        </div>
    </div>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
    }

    .container{
        width: 400px;
        margin: 0 auto;
    }
    .row{
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .submit {
        width: 304px;
        height: 40px;
        color: white;
        background-color: orange;
        border: none;
    }

    h1{
        text-align: center;
    }
    p{
        color:#666;
        text-align: center;
        font-size: 14px;
        padding:10px 0;
    }
    span{
        width: 100px;
        line-height: 40px;
    }
    .edit{
        width: 200px;
        height: 30px;
    }
    
</style>
<script>
    var submit = document.querySelector('.submit');
    submit.onclick = function(){ 
        // 1.获取到编辑框中的内容
        var edit = document.querySelectorAll('.edit');
        var from = edit[0].value;
        var to = edit[1].value;
        var message = edit[2].value;
        console.log(from + "," + to + "," + message); 
        if(from == ''|| to == ''|| message == ''){
            return alert('请填写完整信息');
        }

        // 2.构造html元素
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = from + '对' + to + '说: ' + message;

        // 3.把构造好的元素添加进去
        var container = document.querySelector('.container');
        container.appendChild(row);
    }
    
</script>
</html>
