<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光之魔法书 - Chase the Light</title>
    <link rel="stylesheet" href="magic-book.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="symbol">Σ</div>
            <h1 class="main-title">光之魔法书</h1>
            <p class="subtitle">Chase the Light</p>
            <p class="description">光锥实验室御用的古老魔法书</p>
            <div class="motto">
                <span class="symbol-left">○</span>
                <span class="motto-text">日复一日，必有精进</span>
                <span class="symbol-right">○</span>
            </div>
        </header>

        <main class="content">
            <section class="magic-level">
                <div class="level-header">
                    <h2 class="level-title">下位魔法</h2>
                    <span class="status open">（已开放）</span>
                </div>
                <p class="level-description">通过见习任务学习基础魔法，了解魔法的基本原理</p>
                <div class="decoration">❁</div>
            </section>

            <section class="magic-level">
                <div class="level-header">
                    <h2 class="level-title">上位魔法</h2>
                    <span class="status locked">（掌握前置技能后解锁）</span>
                </div>
                <p class="level-description">通过训练实战各类魔法，熟悉在现实世界中的应用</p>
                <div class="decoration">❁</div>
            </section>

            <section class="magic-level">
                <div class="level-header">
                    <h2 class="level-title">超位魔法</h2>
                    <span class="status locked">（掌握前置技能后解锁）</span>
                </div>
                <p class="level-description">不断挑战和长期练习，精通元素和魔法的高阶应用</p>
                <div class="decoration">❁</div>
            </section>
        </main>
    </div>
</body>
</html>
