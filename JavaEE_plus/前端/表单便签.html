<!DOCTYPE html>
<html lang="zh-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单标签</title>
</head>
<body>
    <form action="text.html" type="get">
        用户名：<input type="text" name="username" placeholder="请输入用户名"><br>
        密&nbsp;&nbsp;&nbsp;码：<input type="password" name="password" placeholder="请输入密码"><br>
        头像：<input type="file" name="avatar"><br>
        性别：<input type="radio" name="gender" value="男">男
            <input type="radio" name="gender" value="女">女<br>
        兴趣爱好：<input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">跑步<br>
        所在城市：<select name="city" id="">
            <option value="1">北京</option>
            <option value="2">上海</option>
            <option value="3">广州</option>
        </select><br>
        个人宣言：
        <textarea name="declare" id="" cols="30" rows="10"></textarea><br>
        <input type="submit" value="提交"><br>
    <!-- <input type="date" name="" id=""> -->
    </form>
    <script>
        let f=5/2;
        console.log(f);

        function add(a,b){
            return a+b;
        }
        console.log(add(1,2));

        let students={
            "name":"张三",
            "age":18,
            "sex":"男"}
        
        console.log(students.name);
    
    </script>
</body>
</html>
