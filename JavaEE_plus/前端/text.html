    <style>
        /* 加载和错误状态样式 */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #666;
            font-size: 18px;
        }

        .loading::before {
            content: "";
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3498db;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background-color: #fce4e4;
            border-left: 4px solid #f44336;
            padding: 20px;
            margin: 30px 0;
            color: #d92424;
            font-size: 16px;
            border-radius: 4px;
        }
    </style>
    <script type="text/javascript">
        function setTab(n) {
            var tli = document.getElementById("leftmenu0").getElementsByTagName("li");
            var mli = document.getElementById("mcont0").getElementsByTagName("ul");
            for (i = 0; i < tli.length; i++) {
                tli[i].className = i == n ? "hover" : "";
                mli[i].style.display = i == n ? "block" : "none";
            }
        }
        // 菜单切换功能
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');
            const siderMenu = document.getElementById('leftmenu0');
            
            if (menuToggle && sidebar) {
                menuToggle.addEventListener('click', function() {
                    sidebar.classList.toggle('active');
                });

                //点击侧边栏菜单项时关闭菜单
                if (siderMenu) {
                    siderMenu.addEventListener('click', function(event) {
                        if (event.target.tagName === 'LI') {
                            sidebar.classList.remove('active');
                        }
                    });
                }
                
                // 点击页面其他地方关闭菜单
                document.addEventListener('click', function(event) {
                    if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
                        sidebar.classList.remove('active');
                    }
                });
            }
        });
    </script>

        .back-to-top.visible {

        /* 移动端显示，桌面端隐藏 */

    <script>
        // 返回顶部按钮功能
        document.addEventListener('DOMContentLoaded', function() {
            const backToTopButton = document.getElementById('backToTop');
            
            // 滚动检测
            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 300) {
                    backToTopButton.classList.add('visible');
                } else {
                    backToTopButton.classList.remove('visible');
                }
            });
            
            // 点击返回顶部
            backToTopButton.addEventListener('click', function() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
