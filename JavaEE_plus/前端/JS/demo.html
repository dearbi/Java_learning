<!DOCTYPE html>
<html lang="zh-CH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button">点我消失</button>
    <script src="jquery-4.0.0.min.js"></script>
    <script>
        // 点我消失
        $(document).ready(function(){
            $('button').click(function(){
                $(this).hide();
            });
        });
        
    </script>
</body>
</html>
